name: soundbars
description: Enregistreur audio dont les barres animées réagissent au son en temps réel.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  record: ">=6.0.0 <7.0.0"
  audioplayers: ">=6.1.0 <7.0.0"
  path_provider: ^2.1.4
  share_plus: ">=10.1.4 <11.0.0"

dev_dependencies:
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/foreground.png"
